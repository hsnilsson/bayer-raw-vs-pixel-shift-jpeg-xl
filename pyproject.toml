[project]
name = "bayer-raw-vs-pixelshift-jxl"
version = "0.1.0"
description = "Compare lower-resolution Bayer raw with high-resolution Pixel-Shift JPEG XL under a fixed storage budget."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "Pillow",
]

[project.optional-dependencies]
tiff = ["tifffile"]
public-tests = ["tifffile"]

[project.scripts]
jxl-archive-test = "jxl_archive_test:main"

[tool.setuptools]
py-modules = ["jxl_archive_test"]

[tool.setuptools.package-dir]
"" = "src"
