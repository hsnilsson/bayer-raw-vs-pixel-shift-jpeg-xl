[project]
name = "ps16-film-scan-pipeline"
version = "0.1.0"
description = "Restartable Windows workflow for Sony PS16 film scanning, DNG/JPEG XL, and FilmLab staging."
requires-python = ">=3.10"
dependencies = ["Pillow"]

[project.scripts]
ps16-scan = "pipeline:main"

[tool.setuptools]
py-modules = ["pipeline"]
